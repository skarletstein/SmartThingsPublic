<!doctype html>
<html><head><meta charset="utf-8"><title>Can You Trust AI? thumbnail</title>
<style>
  @font-face { font-family: Display; src: url(fonts/display.otf) format("opentype"); font-weight: 100 900; }
  @font-face { font-family: UI; src: url(fonts/ui.ttf) format('truetype'); font-weight: 100 900; }
  html, body { margin: 0; background: #0A0A0B; }
  canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Cover / thumbnail for the reel: same tokens, faces and meter as film.js.
// Key content sits in the middle 1080x1350 so 4:5 and 3:4 feed crops keep it.
const C = { bg: '#0A0A0B', ink: '#EDEBE6', acc: '#C8FF2E', dim: '#5E5D59', line: '#1E1E21' };
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
await Promise.all([document.fonts.load('900 100px Display'), document.fonts.load('700 40px UI')]);
const D = (s) => `900 ${s}px Display`, M = (s) => `700 ${s}px UI`;
function fit(str, font, maxW, max) {
  ctx.font = font(100); ctx.letterSpacing = `${-0.035 * 100}px`;
  const w = ctx.measureText(str).width; ctx.letterSpacing = '0px';
  return Math.min(max, Math.floor(100 * maxW / w));
}
function txt(str, x, y, f, col, align = 'left', track = 0) {
  ctx.font = f; ctx.fillStyle = col; ctx.textAlign = align; ctx.letterSpacing = `${track}px`;
  ctx.fillText(str, x, y); ctx.letterSpacing = '0px';
}
ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

// grid floor
const hz = 1330;
ctx.save(); ctx.strokeStyle = C.acc; ctx.lineWidth = 2; ctx.globalAlpha = 0.3;
for (let i = -14; i <= 14; i++) { ctx.beginPath(); ctx.moveTo(W / 2, hz); ctx.lineTo(W / 2 + i * 260, H + 40); ctx.stroke(); }
for (let i = 0; i < 14; i++) { const z = i + 0.6, y = hz + 420 / z; if (y > H) continue; ctx.globalAlpha = 0.3 * Math.max(0, 1.4 - z / 10); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
const g = ctx.createLinearGradient(0, hz - 260, 0, hz + 10);
g.addColorStop(0, 'rgba(200,255,46,0)'); g.addColorStop(1, 'rgba(200,255,46,0.32)');
ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, hz - 260, W, 270);
ctx.restore();

// headline
const X = 78;
const s1 = fit('CAN YOU', D, 924, 230), s2 = fit('TRUST AI?', D, 924, 300);
txt('60-SECOND VERDICT', X + 4, 380, M(40), C.acc);
ctx.fillStyle = C.acc; ctx.fillRect(X + 4, 400, 120, 8);
txt('CAN YOU', X, 400 + s1 * 0.95, D(s1), C.ink, 'left', -0.035 * s1);
// acid ghost for a hint of chromatic split, then the line itself
ctx.globalAlpha = 0.8; txt('TRUST AI?', X + 7, 400 + s1 * 0.95 + s2 * 0.92 + 5, D(s2), '#3d4d0e', 'left', -0.035 * s2); ctx.globalAlpha = 1;
txt('TRUST AI?', X, 400 + s1 * 0.95 + s2 * 0.92, D(s2), C.acc, 'left', -0.035 * s2);

// the meter, needle on the knife edge
const cx = W / 2, cy = 1290, R = 360, v = 0.08, up = -Math.PI / 2, a = v * Math.PI * 0.46;
ctx.lineWidth = 22; ctx.strokeStyle = C.dim; ctx.globalAlpha = 0.5;
ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 1.04, Math.PI * 1.96); ctx.stroke(); ctx.globalAlpha = 1;
ctx.strokeStyle = C.acc; ctx.beginPath(); ctx.arc(cx, cy, R, up, up + a); ctx.stroke();
for (let i = 0; i <= 40; i++) {
  const t = -Math.PI * 0.46 + (i / 40) * Math.PI * 0.92 + up, major = i % 10 === 0;
  const r0 = R * (major ? 0.8 : 0.86), r1 = R * 0.92;
  ctx.strokeStyle = major ? C.ink : C.dim; ctx.lineWidth = major ? 5 : 2;
  ctx.beginPath(); ctx.moveTo(cx + Math.cos(t) * r0, cy + Math.sin(t) * r0); ctx.lineTo(cx + Math.cos(t) * r1, cy + Math.sin(t) * r1); ctx.stroke();
}
txt("DON'T", cx - R, cy + 64, M(40), C.ink, 'center');
txt('TRUST', cx + R, cy + 64, M(40), C.acc, 'center');
ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(0, -R * 0.97); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
ctx.restore();
ctx.beginPath(); ctx.arc(cx, cy, 26, 0, TAU); ctx.fillStyle = C.ink; ctx.fill();
ctx.beginPath(); ctx.arc(cx, cy, 11, 0, TAU); ctx.fillStyle = C.bg; ctx.fill();

// HUD touches
ctx.strokeStyle = C.dim; ctx.lineWidth = 3;
[[36, 150, 1, 1], [W - 36, 150, -1, 1], [36, H - 330, 1, -1], [W - 36, H - 330, -1, -1]].forEach(([x, y, sx, sy]) => {
  ctx.beginPath(); ctx.moveTo(x, y + sy * 46); ctx.lineTo(x, y); ctx.lineTo(x + sx * 46, y); ctx.stroke();
});
ctx.beginPath(); ctx.arc(58, 194, 9, 0, TAU); ctx.fillStyle = C.acc; ctx.fill();
txt('REC  TRUST.SCAN v2.6', 78, 203, M(24), C.ink);
txt('TRUST LEVEL 54%', cx, cy + 150, M(44), C.ink, 'center');

// grade: split tone, scanlines, vignette
const st = ctx.createLinearGradient(0, 0, 0, H);
st.addColorStop(0, 'rgba(210,255,90,0.16)'); st.addColorStop(0.55, 'rgba(40,120,120,0.10)'); st.addColorStop(1, 'rgba(10,80,95,0.28)');
ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = st; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
ctx.fillStyle = 'rgba(0,0,0,0.09)'; for (let y = 3; y < H; y += 4) ctx.fillRect(0, y, W, 1);
const vg = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.3, W / 2, H * 0.5, H * 0.75);
vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
window.done = true;
</script></body></html>
